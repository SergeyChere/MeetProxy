[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meetproxy"
version = "0.6.1"
description = "Let an AI agent run GPU experiments on your GPU (Google Colab today) through a git mailbox"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Sergii Cherepanov"}]
requires-python = ">=3.8"

[project.optional-dependencies]
charts = ["matplotlib"]  # human reports; preinstalled on Colab

[project.scripts]
meet = "meetproxy.cli:main"
meetproxy-runner = "meetproxy.runner:main"

[tool.setuptools]
packages = ["meetproxy"]

[tool.setuptools.package-data]
meetproxy = ["guide.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
