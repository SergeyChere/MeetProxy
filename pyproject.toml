[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-pilot"
version = "0.2.1"
description = "Let an AI agent run GPU experiments in Google Colab through a git mailbox"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Sergii Cherepanov"}]
requires-python = ">=3.8"

[project.scripts]
pilot = "pilot.cli:main"
colab-pilot-runner = "pilot.runner:main"

[tool.setuptools]
packages = ["pilot"]

[tool.setuptools.package-data]
pilot = ["guide.md"]
